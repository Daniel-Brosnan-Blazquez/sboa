     y="365"
     width="370"
     height="115"
     rx="12"
     id="rect10" />
  <text
     class="node-title"
     x="255.0"
     y="403.5"
     id="text11">Activate scheduling rules</text>
  <text
     class="small"
     x="255.0"
     y="429.5"
     id="text12">Engine.insert_configuration()</text>
  <text
