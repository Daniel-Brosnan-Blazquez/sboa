     x="760.0"
     y="599.5"
     id="text25">once per second</text>
  <text
     class="small"
     x="760.0"
     y="625.5"
     id="text26">respect available execution slots</text>
  <rect
     class="box blue"
     x="550"
     y="720"
     width="420"
     height="138"
     rx="12"
     id="rect26" />
  <text
     class="node-title"
     x="760.0"
     y="757.0"
