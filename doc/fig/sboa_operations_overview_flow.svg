     class="node-title"
     x="760.0"
     y="403.5"
     id="text21">Validate and build the agenda</text>
  <text
     class="small"
     x="760.0"
     y="429.5"
     id="text22">XML schema and unique names</text>
  <text
     class="small"
     x="760.0"
     y="455.5"
     id="text23">rules and first triggering times</text>
  <rect
     class="box blue"
