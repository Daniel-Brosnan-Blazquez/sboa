         id="path2" />
    </marker>
    <marker
       id="arrowhead-soft"
       viewBox="0 0 12 10"
       refX="11"
       refY="5"
       markerWidth="12"
       markerHeight="10"
       markerUnits="userSpaceOnUse"
       orient="auto">
      <path
         d="M0 0 L12 5 L0 10 Z"
         fill="#7b8a98"
         id="path3" />
    </marker>
  </defs>
  <rect
     class="bg"
     width="1420"
     height="1510"
     id="rect3" />
  <text
     class="title"
     x="60"
     y="64"
     text-anchor="start"
     id="text3">Scheduler Configuration Flow</text>
  <text
     class="subtitle"
     x="60"
     y="100"
     text-anchor="start"
     id="text4">This flow shows how to configure the scheduler with a new agenda from an XML</text>
  <rect
     class="box blue"
     x="500"
     y="145"
     width="420"
     height="90"
     rx="12"
     id="rect4" />
  <text
     class="node-title"
     x="710.0"
     y="184.0"
     id="text5">Request configuration activation</text>
  <text
     class="small"
     x="710.0"
     y="210.0"
     id="text6">XML path, reference date, start_scheduler</text>
  <rect
     class="box gray"
     x="500"
     y="280"
     width="420"
     height="90"
     rx="12"
     id="rect6" />
  <text
     class="node-title"
     x="710.0"
     y="319.0"
     id="text7">Stop the scheduler</text>
  <text
     class="small"
     x="710.0"
     y="345.0"
     id="text8">terminate tracked processes if running</text>
  <polygon
     class="box amber"
     points="710,405.0 890.0,470 710,535.0 530.0,470"
     id="polygon8" />
  <text
     class="node-title"
     x="710"
     y="464"
     id="text9">Date, XML and</text>
  <text
     class="node-title"
     x="710"
     y="490"
     id="text10">schema valid?</text>
  <rect
     class="box red"
     x="1010"
     y="420"
     width="350"
     height="110"
     rx="12"
     id="rect10" />
  <text
     class="node-title"
     x="1185.0"
     y="456.0"
     id="text11">Return validation error</text>
  <text
     class="small"
     x="1185.0"
     y="482.0"
     id="text12">invalid date, missing file,</text>
  <text
     class="small"
     x="1185.0"
     y="508.0"
     id="text13">malformed XML or schema mismatch</text>
  <rect
     class="box amber"
     x="500"
     y="585"
     width="420"
     height="100"
     rx="12"
     id="rect13" />
  <text
     class="node-title"
     x="710.0"
     y="629.0"
     id="text14">Select active rules and tasks</text>
  <text
     class="small"
     x="710"
     y="655"
     id="text15">omit entries whose skip value is true or 1</text>
  <polygon
     class="box amber"
     points="710,725.0 890.0,790 710,855.0 530.0,790"
     id="polygon15" />
  <text
     class="node-title"
     x="710"
     y="784"
     id="text16">Active names</text>
  <text
     class="node-title"
     x="710"
     y="810"
     id="text17">unique?</text>
  <rect
     class="box red"
     x="1010"
     y="735"
     width="350"
     height="110"
     rx="12"
     id="rect17" />
  <text
     class="node-title"
     x="1185.0"
     y="771.0"
     id="text18">Return duplicate-name error</text>
  <text
     class="small"
     x="1185.0"
     y="797.0"
     id="text19">rule names and task names</text>
  <text
     class="small"
     x="1185.0"
     y="823.0"
     id="text20">must each be unique</text>
  <rect
     class="box blue"
     x="500"
     y="900"
     width="420"
     height="140"
     rx="12"
     id="rect20" />
  <text
     class="node-title"
     x="710.0"
     y="938.0"
     id="text21">Calculate first triggering times</text>
  <text
     class="small"
     x="710.0"
     y="964.0"
     id="text22">specific date, daily time,</text>
  <text
     class="small"
     x="710.0"
     y="990.0"
     id="text23">or next matching weekday</text>
  <text
     class="small"
     x="710.0"
     y="1016.0"
     id="text24">plus recurrence and window settings</text>
  <rect
     class="box green"
     x="500"
     y="1090"
     width="420"
     height="100"
     rx="12"
     id="rect24" />
  <text
     class="node-title"
     x="710.0"
     y="1121.0"
     id="text25">Replace and commit the agenda</text>
  <text
     class="small"
     x="710.0"
     y="1147.0"
     id="text26">delete old rules; insert new rules/tasks</text>
  <polygon
     class="box amber"
     points="710,1225.0 890.0,1290 710,1355.0 530.0,1290"
     id="polygon27" />
  <text
     class="node-title"
     x="710"
     y="1284"
     id="text28">Start scheduler</text>
  <text
     class="node-title"
     x="710"
     y="1310"
     id="text29">requested?</text>
  <rect
     class="box green"
     x="60"
     y="1240"
     width="350"
     height="100"
     rx="12"
     id="rect29" />
  <text
     class="node-title"
     x="235.0"
     y="1284.0"
     id="text30">Return success</text>
  <text
     class="small"
     x="235.0"
     y="1310.0"
     id="text31">agenda is saved; daemon stays stopped</text>
  <rect
     class="box blue"
     x="1010"
     y="1230"
     width="350"
     height="120"
     rx="12"
     id="rect31" />
  <text
     class="node-title"
     x="1185.0"
     y="1271.0"
     id="text32">Request daemon start</text>
  <text
     class="small"
     x="1185.0"
     y="1297.0"
     id="text33">start failure returns an error</text>
  <text
     class="small"
     x="1185.0"
     y="1323.0"
     id="text34">the new agenda is already committed</text>
  <path
     class="arrow"
     d="M710 235 V280"
     id="path34" />
  <path
     class="arrow"
     d="M710 370 V405"
     id="path35" />
  <path
     class="arrow-red"
     d="M890 470 H1010"
     id="path36" />
  <text
     class="label"
     x="950"
     y="450"
     id="text36">no</text>
  <path
     class="arrow"
     d="M710 535 V585"
     id="path37" />
  <text
     class="label"
     x="740"
     y="566"
     id="text37">yes</text>
  <path
     class="arrow"
     d="M710 685 V725"
     id="path38" />
  <path
     class="arrow-red"
     d="M890 790 H1010"
     id="path39" />
  <text
     class="label"
     x="950"
     y="770"
     id="text39">no</text>
  <path
     class="arrow"
     d="M710 855 V900"
     id="path40" />
  <text
     class="label"
     x="740"
     y="884"
     id="text40">yes</text>
  <path
     class="arrow"
     d="M710 1040 V1090"
     id="path41" />
  <path
     class="arrow"
     d="M710 1190 V1225"
     id="path42" />
  <path
     class="arrow"
     d="M530 1290 H411"
     id="path43" />
  <text
     class="label"
     x="470"
     y="1270"
     id="text43">no</text>
  <path
     class="arrow"
     d="M890 1290 H1010"
     id="path44" />
  <text
     class="label"
     x="950"
     y="1270"
     id="text44">yes</text>
  <rect
     class="box gray"
     x="60"
     y="445"
     width="340"
     height="230"
     rx="12"
     id="rect44" />
  <text
     class="node-title"
     x="230.0"
     y="515.0"
     id="text45">Initial date calculation</text>
  <text
     class="small"
     x="230.0"
     y="541.0"
     id="text46">All intervals are expressed in days.</text>
  <text
     class="small"
     x="230.0"
     y="567.0"
     id="text47">A weekday earlier than the</text>
  <text
     class="small"
     x="230.0"
     y="593.0"
     id="text48">reference weekday rolls forward</text>
  <text
     class="small"
     x="230.0"
     y="619.0"
     id="text49">to the following week.</text>
  <text
     class="small"
     x="710"
     y="1430"
     id="text50">A validation failure preserves the previous agenda, but the scheduler has already been stopped.</text>
  <text
     class="small"
     x="710"
     y="1460"
     id="text51">Changing configuration replaces the agenda; it does not merge individual rules or tasks.</text>
</svg>
