<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1660" viewBox="0 0 1420 1660" role="img" aria-labelledby="title desc">
  <title id="title">SBOA Triggering Execution Flow</title>
  <desc id="desc">The triggering helper forks, loads a stored invocation, acquires a worker PID lock, optionally appends execution-window arguments, runs the task command, records completion and releases resources. Exceptions are logged without recording successful completion.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #dbe4ec; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #304c62; stroke-width: 2; }
      .blue { fill: #e8f2ff; stroke: #2c6aa0; }
      .green { fill: #e8f7ef; stroke: #2f7d55; }
      .amber { fill: #fff6df; stroke: #a56a13; }
      .gray { fill: #eef2f5; stroke: #596b7a; }
      .red { fill: #fff0ef; stroke: #a33b32; }
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2d38; }
      .title { font-size: 34px; font-weight: 700; fill: #1d2c38; }
      .subtitle { font-size: 18px; fill: #435363; }
      .section { font-size: 18px; font-weight: 700; fill: #435363; }
      .node-title { font-size: 21px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 18px; fill: #435363; text-anchor: middle; }
      .label { font-size: 17px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: #f8fafc; stroke-width: 6; stroke-linejoin: round; }
      .arrow { stroke: #304c62; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #a33b32; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-soft { stroke: #7b8a98; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowhead-soft); }
    </style>
    <marker id="arrowhead" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#304c62"/>
    </marker>
    <marker id="arrowhead-red" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#a33b32"/>
    </marker>
    <marker id="arrowhead-soft" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#7b8a98"/>
    </marker>
  </defs>
  <rect class="bg" width="1420" height="1660"/>
  <text class="title" x="60" y="64" text-anchor="start">Triggering Execution Flow</text>
  <text class="subtitle" x="60" y="100" text-anchor="start">A worker runs one stored task invocation and releases its PID lock and database sessions on completion.</text>
  <rect class="box blue" x="500" y="145" width="420" height="100" rx="12"/>
  <text class="node-title" x="710.0" y="176.0">Launch boa_execute_triggering.py</text>
  <text class="small" x="710.0" y="202.0">triggering UUID, begin and end dates</text>
  <text class="small" x="710.0" y="228.0">fork: parent exits; child executes</text>
  <polygon class="box amber" points="710,280.0 890.0,345 710,410.0 530.0,345"/>
  <text class="node-title" x="710" y="339">Stored triggering</text>
  <text class="node-title" x="710" y="365">exists?</text>
  <rect class="box gray" x="1010" y="295" width="350" height="100" rx="12"/>
  <text class="node-title" x="1185.0" y="339.0">Return without execution</text>
  <text class="small" x="1185.0" y="365.0">close database sessions</text>
  <rect class="box gray" x="500" y="445" width="420" height="100" rx="12"/>
  <text class="node-title" x="710.0" y="476.0">Acquire the worker PID lock</text>
  <text class="small" x="710.0" y="502.0">on_going_triggerings/</text>
  <text class="small" x="710.0" y="528.0">boa_scheduler_&lt;pid&gt;.pid</text>
  <polygon class="box amber" points="710,580.0 890.0,645 710,710.0 530.0,645"/>
  <text class="node-title" x="710" y="639">PID lock</text>
  <text class="node-title" x="710" y="665">acquired?</text>
  <rect class="box red" x="1010" y="595" width="350" height="110" rx="12"/>
  <text class="node-title" x="1185.0" y="631.0">Log lock failure and return</text>
  <text class="small" x="1185.0" y="657.0">do not execute the command</text>
  <text class="small" x="1185.0" y="683.0">close database sessions</text>
  <polygon class="box amber" points="710,780.0 890.0,845 710,910.0 530.0,845"/>
  <text class="node-title" x="710" y="839">Add window</text>
  <text class="node-title" x="710" y="865">arguments?</text>
  <rect class="box blue" x="60" y="795" width="350" height="100" rx="12"/>
  <text class="node-title" x="235.0" y="839.0">Append execution window</text>
  <text class="small" x="235.0" y="865.0">-b &lt;begin&gt; -e &lt;end&gt;</text>
  <rect class="box blue" x="500" y="990" width="420" height="110" rx="12"/>
  <text class="node-title" x="710.0" y="1026.0">Run the task command</text>
  <text class="small" x="710.0" y="1052.0">split command into arguments</text>
  <text class="small" x="710.0" y="1078.0">wait for stdout, stderr and exit code</text>
  <rect class="box red" x="1010" y="995" width="350" height="110" rx="12"/>
  <text class="node-title" x="1185.0" y="1031.0">Log execution exception</text>
  <text class="small" x="1185.0" y="1057.0">leave triggering unfinished</text>
  <text class="small" x="1185.0" y="1083.0">continue to resource cleanup</text>
  <rect class="box green" x="500" y="1165" width="420" height="110" rx="12"/>
  <text class="node-title" x="710.0" y="1201.0">Record invocation completion</text>
  <text class="small" x="710.0" y="1227.0">log the command return code</text>
  <text class="small" x="710.0" y="1253.0">set triggered = true; commit</text>
  <rect class="box gray" x="500" y="1340" width="420" height="110" rx="12"/>
  <text class="node-title" x="710.0" y="1376.0">Release runtime resources</text>
  <text class="small" x="710.0" y="1402.0">release the acquired PID lock</text>
  <text class="small" x="710.0" y="1428.0">close database sessions</text>
  <path class="arrow" d="M710 245 V280"/>
  <path class="arrow" d="M890 345 H1010"/>
  <text class="label" x="950" y="325">no</text>
  <path class="arrow" d="M710 410 V445"/>
  <text class="label" x="740" y="437">yes</text>
  <path class="arrow" d="M710 545 V580"/>
  <path class="arrow-red" d="M890 645 H1010"/>
  <text class="label" x="950" y="625">no</text>
  <path class="arrow" d="M710 710 V780"/>
  <text class="label" x="740" y="750">yes</text>
  <path class="arrow" d="M530 845 H410"/>
  <text class="label" x="470" y="825">yes</text>
  <path class="arrow" d="M235 895 V1045 H500"/>
  <path class="arrow" d="M710 910 V990"/>
  <text class="label" x="740" y="953">no</text>
  <path class="arrow-red" d="M920 1045 H1010"/>
  <text class="label" x="965" y="1023">exception</text>
  <path class="arrow" d="M710 1100 V1165"/>
  <text class="label" x="755" y="1138">returned</text>
  <path class="arrow" d="M710 1275 V1340"/>
  <path class="arrow-red" d="M1185 1105 V1395 H920"/>
  <text class="small" x="710" y="1515">Completion means the invocation returned: a nonzero command exit code still sets triggered = true.</text>
  <text class="small" x="710" y="1550">Stopping the scheduler uses its tracked PID files to terminate the daemon and worker processes.</text>
  <text class="small" x="710" y="1585">A worker exception does not undo the next task date already saved by the scheduler.</text>
</svg>
