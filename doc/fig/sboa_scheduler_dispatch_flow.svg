     inkscape:current-layer="svg53" />
  <title
     id="title">SBOA Scheduler Polling and Dispatch</title>
  <desc
     id="desc">Each scheduler poll counts recent unfinished triggerings, checks available capacity, selects due tasks, records each triggering, advances its next date, calculates the execution window and dispatches worker commands.</desc>
  <defs
     id="defs3">
    <style
       id="style1">
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #dbe4ec; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #304c62; stroke-width: 2; }
      .blue { fill: #e8f2ff; stroke: #2c6aa0; }
      .green { fill: #e8f7ef; stroke: #2f7d55; }
      .amber { fill: #fff6df; stroke: #a56a13; }
      .gray { fill: #eef2f5; stroke: #596b7a; }
      .red { fill: #fff0ef; stroke: #a33b32; }
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2d38; }
      .title { font-size: 34px; font-weight: 700; fill: #1d2c38; }
      .subtitle { font-size: 18px; fill: #435363; }
      .section { font-size: 18px; font-weight: 700; fill: #435363; }
      .node-title { font-size: 21px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 18px; fill: #435363; text-anchor: middle; }
      .label { font-size: 17px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: #f8fafc; stroke-width: 6; stroke-linejoin: round; }
      .arrow { stroke: #304c62; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #a33b32; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-soft { stroke: #7b8a98; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowhead-soft); }
    </style>
    <marker
       id="arrowhead"
       viewBox="0 0 12 10"
       refX="11"
       refY="5"
       markerWidth="12"
       markerHeight="10"
       markerUnits="userSpaceOnUse"
       orient="auto">
      <path
         d="M0 0 L12 5 L0 10 Z"
         fill="#304c62"
         id="path1" />
    </marker>
    <marker
       id="arrowhead-red"
       viewBox="0 0 12 10"
       refX="11"
       refY="5"
       markerWidth="12"
       markerHeight="10"
       markerUnits="userSpaceOnUse"
       orient="auto">
      <path
         d="M0 0 L12 5 L0 10 Z"
         fill="#a33b32"
         id="path2" />
    </marker>
    <marker
       id="arrowhead-soft"
       viewBox="0 0 12 10"
       refX="11"
       refY="5"
       markerWidth="12"
       markerHeight="10"
       markerUnits="userSpaceOnUse"
       orient="auto">
      <path
         d="M0 0 L12 5 L0 10 Z"
         fill="#7b8a98"
         id="path3" />
    </marker>
  </defs>
  <rect
     class="bg"
     width="1420"
     height="1560"
     id="rect3" />
  <text
     class="title"
     x="60"
     y="64"
     text-anchor="start"
     id="text3">Scheduler Polling and Dispatch</text>
  <text
     class="subtitle"
     x="60"
     y="100"
     text-anchor="start"
     id="text4">Each poll enforces execution capacity before creating triggerings and launching command workers.</text>
  <rect
     class="box blue"
     x="500"
     y="145"
     width="420"
     height="90"
     rx="12"
     id="rect4" />
  <text
     class="node-title"
     x="710.0"
     y="184.0"
     id="text5">Poll the agenda</text>
  <text
     class="node-title"
     x="1178.4723"
     y="301.84607"
     id="text5-6"
     style="font-weight:600;font-size:21px;font-family:Arial, Helvetica, sans-serif;text-anchor:middle;fill:#1f2d38"><tspan
       sodipodi:role="line"
       id="tspan54"
       x="1178.4723"
       y="301.84607">Note: currently, long-running</tspan><tspan
       sodipodi:role="line"
       x="1178.4723"
       y="328.09607"
       id="tspan55">triggerings (&gt; 30 mins) are not</tspan><tspan
       sodipodi:role="line"
       x="1178.4723"
       y="354.34607"
       id="tspan57">considered to block new triggerings</tspan></text>
  <text
     class="node-title"
     x="1161.672"
     y="1222.2505"
     id="text5-6-5"
     style="font-weight:600;font-size:21px;font-family:Arial, Helvetica, sans-serif;text-anchor:middle;fill:#1f2d38"><tspan
       sodipodi:role="line"
       x="1161.672"
       y="1222.2505"
       id="tspan57-6">Note: currently, there is no option</tspan><tspan
       sodipodi:role="line"
       x="1161.672"
       y="1248.5005"
       id="tspan59">to configure one shot tasks</tspan></text>
  <text
     class="small"
     x="710.0"
     y="210.0"
     id="text6">the daemon wakes once per second</text>
  <rect
     class="box green"
     x="500"
     y="275"
     width="420"
     height="100"
     rx="12"
     id="rect6" />
  <text
     class="node-title"
     x="710.0"
     y="306.0"
     id="text7">Count recent unfinished triggerings</text>
  <text
     class="small"
     x="710.0"
     y="332.0"
     id="text8">triggered = false</text>
  <text
     class="small"
     x="710.0"
     y="358.0"
     id="text9">created within the previous 30 minutes</text>
  <polygon
     class="box amber"
     points="710,405.0 890.0,470 710,535.0 530.0,470"
     id="polygon9" />
  <text
     class="node-title"
     x="710"
     y="464"
     id="text10">Execution slots</text>
  <text
     class="node-title"
     x="710"
     y="490"
     id="text11">available?</text>
  <rect
     class="box gray"
     x="1010"
     y="420"
     width="350"
     height="100"
     rx="12"
     id="rect11" />
  <text
     class="node-title"
     x="1185.0"
     y="451.0"
     id="text12">Log capacity reached</text>
  <text
     class="small"
     x="1185.0"
     y="477.0"
     id="text13">close database sessions</text>
  <text
     class="small"
     x="1185.0"
     y="503.0"
     id="text14">return to the daemon loop</text>
  <rect
     class="box green"
     x="500"
     y="575"
     width="420"
     height="100"
     rx="12"
     id="rect14" />
  <text
     class="node-title"
     x="710.0"
     y="606.0"
     id="text15">Select due tasks</text>
  <text
     class="small"
     x="710.0"
     y="632.0"
     id="text16">triggering_time is at or before now</text>
  <text
     class="small"
     x="710.0"
     y="658.0"
     id="text17">take no more than the available slots</text>
  <polygon
     class="box amber"
     points="710,705.0 890.0,770 710,835.0 530.0,770"
     id="polygon17" />
  <text
     class="node-title"
     x="710"
     y="764"
     id="text18">Any due tasks</text>
  <text
     class="node-title"
     x="710"
     y="790"
     id="text19">selected?</text>
  <rect
     class="box gray"
     x="1010"
     y="720"
     width="350"
     height="100"
     rx="12"
     id="rect19" />
  <text
     class="node-title"
     x="1185.0"
     y="751.0"
     id="text20">Finish this poll</text>
  <text
     class="small"
     x="1185.0"
     y="777.0"
     id="text21">close database sessions</text>
  <text
     class="small"
     x="1185.0"
     y="803.0"
     id="text22">return to the daemon loop</text>
  <rect
     class="box green"
     x="500"
     y="870"
     width="420"
     height="100"
     rx="12"
     id="rect22" />
  <text
     class="node-title"
     x="710.0"
     y="901.0"
     id="text23">Record each selected triggering</text>
  <text
     class="small"
     x="710.0"
     y="927.0"
     id="text24">validate task and current date</text>
  <text
     class="small"
     x="710.0"
     y="953.0"
     id="text25">insert triggered = false; commit</text>
  <polygon
     class="box amber"
     points="710,1005.0 890.0,1070 710,1135.0 530.0,1070"
     id="polygon25" />
  <text
     class="node-title"
     x="710"
     y="1064"
     id="text26">Triggering insert</text>
  <text
     class="node-title"
     x="710"
     y="1090"
     id="text27">succeeded?</text>
  <rect
     class="box red"
     x="60"
     y="1015"
     width="350"
     height="110"
     rx="12"
     id="rect27" />
  <text
     class="node-title"
     x="235.0"
     y="1051.0"
     id="text28">Skip this task for this poll</text>
  <text
     class="small"
     x="235.0"
     y="1077.0"
     id="text29">do not advance its schedule</text>
  <text
     class="small"
     x="235.0"
     y="1103.0"
     id="text30">do not queue a worker</text>
  <rect
     class="box blue"
     x="500"
     y="1170"
     width="420"
     height="130"
     rx="12"
     id="rect30" />
  <text
     class="node-title"
     x="710.0"
     y="1203.0"
     id="text31">Prepare window and next date</text>
  <text
     class="small"
     x="710.0"
     y="1229.0"
     id="text32">stop = task time - window_delay</text>
  <text
     class="small"
     x="710.0"
     y="1255.0"
     id="text33">start = stop - window_size</text>
  <text
     class="small"
     x="710.0"
     y="1281.0"
     id="text34">next task time = task time + periodicity</text>
  <rect
     class="box blue"
     x="500"
     y="1350"
     width="420"
     height="100"
     rx="12"
     id="rect34" />
  <text
     class="node-title"
     x="710.0"
     y="1381.0"
     id="text35">Dispatch queued worker commands</text>
  <text
     class="small"
     x="710.0"
     y="1407.0"
     id="text36">parallel pool launches triggering helpers</text>
  <text
     class="small"
     x="710.0"
     y="1433.0"
     id="text37">close pool and database sessions</text>
  <path
     class="arrow"
     d="M710 235 V275"
     id="path37" />
  <path
     class="arrow"
     d="M710 375 V405"
     id="path38" />
  <path
     class="arrow"
     d="M890 470 H1010"
     id="path39" />
  <text
     class="label"
     x="950"
     y="450"
     id="text39">no</text>
  <path
     class="arrow"
     d="M710 535 V575"
     id="path40" />
  <text
     class="label"
     x="740"
     y="560"
     id="text40">yes</text>
  <path
     class="arrow"
     d="M710 675 V705"
     id="path41" />
  <path
     class="arrow"
     d="M890 770 H1010"
     id="path42" />
  <text
     class="label"
     x="950"
     y="750"
     id="text42">no</text>
  <path
     class="arrow"
     d="M710 835 V870"
     id="path43" />
  <text
     class="label"
     x="740"
     y="862"
     id="text43">yes</text>
  <path
     class="arrow"
     d="M710 970 V1005"
     id="path44" />
  <path
     class="arrow-red"
     d="M530 1070 H410"
     id="path45" />
  <text
     class="label"
     x="470"
     y="1050"
     id="text45">no</text>
  <path
     class="arrow"
     d="M710 1135 V1170"
     id="path46" />
  <text
     class="label"
     x="740"
     y="1163"
     id="text46">yes</text>
  <path
     class="arrow"
     d="M710 1300 V1350"
     id="path47" />
  <path
     class="arrow-soft"
     d="M235 1125 V1400 H500"
     id="path48" />
  <text
     class="label"
     x="330"
     y="1375"
     id="text48">other queued tasks</text>
  <rect
     class="box gray"
     x="60"
     y="260"
     width="350"
     height="180"
     rx="12"
     id="rect48" />
  <text
     class="node-title"
     x="235.0"
     y="318.0"
     id="text49">Capacity calculation</text>
  <text
     class="small"
     x="235.0"
     y="344.0"
     id="text50">available slots =</text>
  <text
     class="small"
     x="235.0"
     y="370.0"
     id="text51">MAXIMUM_PARALLEL_TASKS</text>
  <text
     class="small"
     x="235.0"
     y="396.0"
     id="text52">- recent unfinished triggerings</text>
  <text
     class="small"
     x="710"
     y="1510"
     id="text53">The next task date is committed before command execution; command failure does not roll it back.</text>
</svg>
